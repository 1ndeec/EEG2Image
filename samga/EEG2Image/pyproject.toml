[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samga-eeg-image"
version = "0.1.0"
description = "Subject-aware EEG-image alignment with visual LoRA and labeled-support calibration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "Pillow>=10", "open_clip_torch==3.3.0"]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel"]
plots = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["things_eeg2*"]
